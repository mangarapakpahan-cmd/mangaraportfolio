<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Portfolio CMS</title>
  <meta name="description" content="Login ke Admin Dashboard untuk mengelola konten portofolio.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon -->
  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">

  <!-- Login CSS -->
  <link rel="stylesheet" href="./assets/css/login.css">
</head>

<body>

  <!-- Animated Background -->
  <div class="bg-canvas" aria-hidden="true">
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
  </div>

  <!-- Login Card -->
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="login-logo-icon">
          <ion-icon name="briefcase-outline"></ion-icon>
        </div>
        <div class="login-logo-text">
          <span class="login-logo-title">Portfolio CMS</span>
          <span class="login-logo-sub">Admin Panel</span>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="login-heading">Welcome back 👋</h1>
      <p class="login-subheading">Masuk ke dashboard untuk mengelola konten portofolio Anda.</p>

      <!-- Error Toast -->
      <div class="error-toast" id="error-toast" role="alert" aria-live="polite">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span id="error-message">Email atau password salah. Silakan coba lagi.</span>
      </div>

      <!-- Login Form -->
      <form class="login-form" id="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="admin@example.com"
              autocomplete="email"
              required
            >
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Toggle password visibility">
              <ion-icon name="eye-outline" id="toggle-icon"></ion-icon>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="login-btn" disabled>
          <span class="btn-text">Masuk ke Dashboard</span>
          <div class="btn-spinner"></div>
        </button>

      </form>

      <!-- Footer -->
      <div class="login-footer">
        <p>Kembali ke <a href="./index.html">halaman portofolio</a></p>
      </div>

    </div>
  </div>

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <!-- Login Logic (ES Module) -->
  <script type="module">
    import { loginWithEmail, loginGuard } from "./assets/js/auth.js";

    // Redirect jika sudah login
    loginGuard();

    const form        = document.getElementById("login-form");
    const emailInput  = document.getElementById("email");
    const passInput   = document.getElementById("password");
    const loginBtn    = document.getElementById("login-btn");
    const errorToast  = document.getElementById("error-toast");
    const errorMsg    = document.getElementById("error-message");
    const toggleBtn   = document.getElementById("toggle-password");
    const toggleIcon  = document.getElementById("toggle-icon");

    // Enable button only when both fields filled
    function checkInputs() {
      loginBtn.disabled = !(emailInput.value.trim() && passInput.value.trim());
    }
    emailInput.addEventListener("input", checkInputs);
    passInput.addEventListener("input", checkInputs);

    // Toggle password visibility
    toggleBtn.addEventListener("click", () => {
      const isPassword = passInput.type === "password";
      passInput.type = isPassword ? "text" : "password";
      toggleIcon.setAttribute("name", isPassword ? "eye-off-outline" : "eye-outline");
    });

    // Show error toast
    function showError(message) {
      errorMsg.textContent = message;
      errorToast.classList.add("show");
      setTimeout(() => errorToast.classList.remove("show"), 5000);
    }

    // Firebase error → pesan user-friendly
    function getFriendlyError(code) {
      const map = {
        "auth/invalid-email":        "Format email tidak valid.",
        "auth/user-not-found":       "Akun dengan email ini tidak ditemukan.",
        "auth/wrong-password":       "Password yang Anda masukkan salah.",
        "auth/invalid-credential":   "Email atau password salah. Silakan coba lagi.",
        "auth/too-many-requests":    "Terlalu banyak percobaan. Coba lagi beberapa saat.",
        "auth/network-request-failed": "Gagal terhubung. Periksa koneksi internet Anda.",
      };
      return map[code] || "Terjadi kesalahan. Silakan coba lagi.";
    }

    // Form submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorToast.classList.remove("show");

      loginBtn.classList.add("loading");
      loginBtn.disabled = true;

      try {
        await loginWithEmail(emailInput.value.trim(), passInput.value);
        // onAuthStateChanged di auth.js akan handle redirect ke admin.html
        window.location.replace("./admin.html");
      } catch (err) {
        showError(getFriendlyError(err.code));
        loginBtn.classList.remove("loading");
        loginBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
